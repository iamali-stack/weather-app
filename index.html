<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>

  <!-- ===== Stylesheets ===== -->
  <link rel="stylesheet" href="styles.css" />
  <!-- Bootstrap CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <!-- ===== Fonts ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=PT+Sans+Caption:wght@400;700&family=Pacifico&family=Righteous&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- ===== Font Awesome ===== -->
  <link rel="stylesheet" href="fontawesome-all.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/fontawesome.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/brands.min.css" />

</head>

<body class="bg-dark text-white" style="min-height:100vh;">

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
    <div class="container" style="width: 80%;">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <span class="me-2"><img src="images/logo_2x.png" alt="" class="logo" width="64" height="38"></span>
        <div>
          <div class="fw-bold">Weather</div>
          <small>tagline goes here</small>
        </div>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">News</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Live cameras</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Photos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="contact.html">Contact</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section with Background -->
  <section class="hero-section position-relative" style="min-height: 420px;">
    <div class="hero-bg-img"></div>
    <div class="hero-overlay"></div>
    <div class="container position-relative z-2 py-5">
      <!-- Search Bar -->
      <form class="search-form mb-4">
        <input class="search-input" type="text" placeholder="Find your location...">
        <button class="search-btn" type="submit">Find</button>
      </form>
      <!-- Weather Cards Row -->
      <div class="weather-cards-row mx-auto">
        <div class="row justify-content-center gx-0">
          <!-- Today Card -->
          <div class="col-lg-4 col-md-12 mb-0">
            <div class="card weather-card glass-card h-100 text-white p-4">
              <div class="forecast-header px-3 py-2 d-flex justify-content-between align-items-center">
                <span class="forecast-day" id="today-day"></span>
                <span class="forecast-date" id="today-date"></span>
              </div>
              <div class="card-body d-flex flex-column justify-content-between h-100">
                <div>
                  <h5 class="card-title mb-3" style="font-size:1.3rem;" id="city-name"></h5>
                  <div class="display-1 fw-bold mb-3" style="font-size:4.5rem;" id="today-temp"><sup>°C</sup></div>
                  <div class="mb-2" id="today-icon">
                    
                  </div>
                  <div class="mb-2">
                    <p class="weather-status" id="today-status"></p>
                  </div>
                </div>
                <div class="d-flex align-items-center small mt-4 pt-2 text-secondary" style="font-size:1.1rem;">
                  <span class="me-4"><i class="fa-solid fa-droplet me-1"></i> <span id="today-humidity"></span></span>
                  <span class="me-4"><i class="fa-solid fa-wind me-1"></i> <span id="today-wind"></span></span>
                  <span><i class="fa-solid fa-compass me-1"></i> <span id="today-wind-direction"></span></span>
                </div>
              </div>
            </div>
          </div>
          <!-- Monday Card -->
          <div class="col-lg-4 col-md-6 mb-0">
            <div class="card weather-card glass-card h-100 text-white p-4">
              <div class="forecast-header px-3 py-2 text-center">
                <span class="forecast-day" id="tomorrow"></span>
              </div>
              <div class="card-body text-center d-flex flex-column justify-content-center h-100">
                <div class="mb-2" id="tomorrow-icon"></div>
                <div class="h3 fw-bold mb-1" id="tomorrow-temp"><sup>°C</sup></div>
                <div class="text-secondary mb-1" id="tomorrow-min-temp"><sup>°</sup></div>
                <p class="weather-status" id="tomorrow-status"></p>
              </div>
            </div>
          </div>
          <!-- Tuesday Card -->
          <div class="col-lg-4 col-md-6 mb-0">
            <div class="card weather-card glass-card h-100 text-white p-4">
              <div class="forecast-header px-3 py-2 text-center">
                <span class="forecast-day" id="the day after tomorrow"></span>
              </div>
              <div class="card-body text-center d-flex flex-column justify-content-center h-100">
                <div class="mb-2" id="the day after tomorrow-icon"></div>
                <div class="h3 fw-bold mb-1" id="the day after tomorrow-temp"><sup>°C</sup></div>
                <div class="text-secondary mb-1" id="the day after tomorrow-min-temp"><sup>°</sup></div>
                <p class="weather-status" id="the day after tomorrow-status"></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-flex">
        <form class="footer-form">
          <input type="text" class="footer-input" placeholder="Enter your email to subscribe...">
          <button type="submit" class="footer-btn">Subscribe</button>
        </form>
        <div class="footer-social">
          <a href="#"><i class="fab fa-facebook-f"></i></a>
          <a href="#"><i class="fab fa-twitter"></i></a>
          <a href="#"><i class="fab fa-google-plus-g"></i></a>
          <a href="#"><i class="fab fa-pinterest-p"></i></a>
        </div>
      </div>
      <p class="colophon">Copyright 2014 Company name. Designed by Themezy. All rights reserved</p>
    </div>
  </footer>

  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- ===== Scripts ===== -->
  <script src="java.js"></script>
  
</body>
</html>
